manifest-tool-for-multiarch:
  image:
    name: curlimages/curl:latest
    entrypoint:
    - ''
  stage: deploy
  rules:
  - if: "$KANIKO_COMP_MANIFEST_PLATFORMS"
  variables:
    BASETAGSBUILT: "$BASETAGSBUILT"
  before_script:
  - curl -s -L https://github.com/estesp/manifest-tool/releases/download/v2.0.8/binaries-manifest-tool-2.0.8.tar.gz | tar xvz
  - mv manifest-tool-linux-amd64 manifest-tool
  - chmod +x manifest-tool
  script:
  - |-
    if [[ "${CI_DEBUG_TRACE}" == "true" || "${CI_COMPONENT_TRACE}" == "true" ]]; then
      echo "CI Component Trace (CI_COMPONENT_TRACE) or GitLab's global trace (CI_DEBUG_TRACE) has been set, debug logging. More info: https://docs.gitlab.com/ee/ci/variables/#enable-debug-logging"
      set -xv
    fi
    ./manifest-tool --username "${CI_REGISTRY_USER}" --password "${CI_REGISTRY_PASSWORD}" push from-args \
    --platforms ${KANIKO_COMP_MANIFEST_PLATFORMS} \
    --template ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}-ARCH \
    --tags $(echo $BASETAGSBUILT | sed 's/ /,/g') \
    --target ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
send-to-production:
  stage: deploy
  image: alpine:3.20.3
  before_script:
  - apk add --no-cache git openssh
  - git config --global user.email "yyewolf@gmail.com"
  - git config --global user.name "Gitlab CI"
  - mkdir -p ~/.ssh
  - cat "$SSH_KEY" > ~/.ssh/id_ed25519
  - chmod 600 ~/.ssh/id_ed25519
  - eval $(ssh-agent -s)
  - ssh-add ~/.ssh/id_ed25519
  - ssh-keyscan github.com >> ~/.ssh/known_hosts
  script:
  - git clone git@github.com:4T-24/ctf-2024-infra-challenges.git
  - cd ctf-2024-infra-challenges
  - RELATIVE_PATH=$(echo "$CI_PROJECT_PATH" | sed 's/^4ts\/ctf-2024\///')
  - mkdir -p "$RELATIVE_PATH"
  - cp "$CI_PROJECT_DIR/chall.yaml" "$RELATIVE_PATH/chall.yaml"
  - git add "$RELATIVE_PATH/chall.yaml"
  - git commit -m "Deploying chall.yaml to production"
  - git push
  only:
  - tags
  - master
test:
  stage: .post
  image: alpine:3.20.3
  only:
  - test
stages:
- ".pre"
- build
- deploy
- ".post"
